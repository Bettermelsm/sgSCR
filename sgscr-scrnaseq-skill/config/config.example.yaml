# config/config.example.yaml
# sgscr-scrnaseq-skill 配置模板。所有 <TBD, 用户确认> 占位符需用户确认后填入；未填完不允许用于生产运行。

run:
  run_id: "<TBD, 自动生成或用户指定，如 20260115_UC_run1>"
  random_seed: <TBD, 用户确认>

species:
  organism: "human"                      # 显式参数化（需求5.1）
  singleR_reference: "<TBD, 用户确认>"    # 如 HumanPrimaryCellAtlasData（需求5.2）；校验见 P5
  reference_species: "human"             # 所选参考集所属物种；P5 校验本字段 == organism

samples:
  manifest:                              # 样本清单与分组（需求6.1）；样本 ID/分组名由项目决定，原文不转换
    - { sample_id: "<TBD, 用户确认：样本1 ID>", group: "<TBD, 用户确认：分组名>" }
    - { sample_id: "<TBD, 用户确认：样本2 ID>", group: "<TBD, 用户确认：分组名>" }
    # excluded 样本写法：- { sample_id: "X", reason: "QC 不合格/用户裁决排除" }
  excluded:                              # 样本剔除决策及依据（需求6.5）；S0 校验自动跳过
    - sample_id: "<示例占位, 如 S5>"
      reason: "<TBD, 用户确认剔除依据>"

remote:
  mode: "local"                          # P12-a A2：local=单机模式（run_step.sh 本机直接执行，
                                         # remote_exec.sh sync 无操作、exec/fetch 本机直做）；
                                         # ssh=远程模式（remote_exec.sh sync/exec/fetch 走 ssh+frp 兜底）
  host_alias: "<TBD, 用户确认，ssh config 中的 Host 别名>"
  ssh_target: "<TBD, 用户确认，如 <user>@<host> 或 ssh config 中的 Host 别名>"
  frp_fallback:
    host: "<TBD, 用户确认>"
    port: <TBD, 用户确认>
  data_dir: "<TBD, 用户确认，10X 三联文件所在目录>"   # 需求3.3
  remote_work_dir: "<TBD, 用户确认，如 /opt/sgscr/runs/{run_id}>"
  triplet_files: ["barcodes.tsv.gz", "features.tsv.gz", "matrix.mtx.gz"]

envs:                                    # 需求4：按工具隔离环境（conda env 名称）
  main: "<TBD, 用户确认，如 sgscr_main 或复用已有环境名>"
  cellchat: "<TBD, 用户确认，如 sgscr_cellchat>"
  trajectory: "<TBD, 用户确认，如 sgscr_trajectory>"
  scenic: "<TBD, 用户确认，如 sgscr_scenic>"

qc:                                      # 需求6.2：QC阈值可配置
  min_features: <TBD, 用户确认>
  max_features: <TBD, 用户确认>
  min_cells_per_gene: <TBD, 用户确认>
  max_percent_mt: <TBD, 用户确认>
  max_percent_hb: <TBD, 用户确认>
  min_cells_pass_gate: <TBD, 用户确认>   # S2 Quality_Gate 下限
  # mt_pattern: "^MT-"                   # P12-a A3：线粒体基因前缀正则；缺省时按 organism
                                         # 自动选（human="^MT-", mouse="^mt-"）；其它物种必须显式给出

design:                                  # P12-a A1：组比较设计（s10 消费；不配则退回 ctrl/case）
  groups: ["ctrl", "treat"]              # 第一项=control，第二项=case（顺序即方向）
  contrast: "treat_minus_ctrl"           # 差值命名基准，产物列名如 diff_treat_minus_ctrl

integration:
  dims: <TBD, 用户确认>
  reduction: "<TBD, 用户确认，如 cca 或 rpca>"
  nfeatures_hvg: <TBD, 用户确认>

pca:                                     # 需求9：PC数定量选择阈值
  npcs_compute: <TBD, 用户确认，如 50>
  cum_variance_threshold_pct: <TBD, 用户确认，设计默认思路 90>
  single_pc_contrib_threshold_pct: <TBD, 用户确认，设计默认思路 5>
  elbow_diff_threshold: <TBD, 用户确认>
  fallback_npc: <TBD, 用户确认>          # 退化输入时的备用 PC 数（P8）
  manual_pc_override: null               # 人工覆盖 PC 数（如 30）：设置后跳过自动算法，Manifest 如实记录 basis=manual_override 并保留自动算法建议值对比；不设/置 null 走自动流程

clustering:                              # 需求10：候选分辨率与ARI
  candidate_resolutions: [<TBD, 用户确认，如 0.1, 0.3, 0.5, 0.7, 0.9, 1.1>]
  ari_drop_threshold: <TBD, 用户确认>    # 相邻分辨率 ARI 骤降判定阈值

compartments:                            # 需求12：需单独亚聚类的Compartment
  targets: ["<TBD, 用户确认：primary compartment>", "<TBD, 用户确认：候补 compartment>"]
                                         # 第一个=primary（主线 compartment），其余=候补
  subcluster_resolution: <TBD, 用户确认>
  subcluster_npcs: 10                    # 子聚类 PCA 维数上限（P11A 起入 Config，默认10）

annotation:                              # P12-a A4：marker 面板外置（P12-b C3 起消费）
  marker_panel: "<TBD, 用户确认：如 human_colon / mouse_brain>"
                                         # 对应 references/marker_panels/<名称>.yaml；
                                         # 面板按 物种_组织 命名（如 mouse_brain）

cellchat:
  pathways_of_interest: ["TGFb", "CCL", "MIF"]
  min_cells_per_group: <TBD, 用户确认>
  exclude_groups: []                     # P11A 起支持；真实 UC 运行设为 ["low_quality"]

trajectory:
  tool: "<TBD, 用户确认: slingshot(设计推荐) | monocle3>"
  target_compartment: ["<TBD, 如 myeloid>"]   # P11A 起支持列表（向后兼容单值）；
                                              # 第一个=primary（论文主线），其余=backup（候补存档）；
                                              # 各 compartment 独立执行，单一 FAIL 不阻断其余
  start_cluster: {}                      # P11D-c：可选，<comp>: <簇id> 指定 slingshot 起点；
                                         # 未指定的 comp 不指定起点

scenic:
  backend: "<TBD, 用户确认: pyscenic(设计推荐) | r_scenic>"
  species_db_path: "<TBD, 用户确认，物种参考数据库(feather)本地路径>"
  target_subset: "<TBD, 用户确认，如 fibroblast 相关亚群>"
  nes_threshold: 3.0                     # pySCENIC 标准阈值；mock 冒烟专用更低值不代表正式推荐

target_genes:                            # 需求16：目标基因清单（基因名由用户项目决定）
  genes: ["<TBD, 用户确认：目标基因1>", "<TBD, 用户确认：目标基因2>"]
  science_questions:
    "<TBD, 用户确认：目标基因1>": "<TBD, 用户确认：该基因对应要回答的科学问题>"
    "<TBD, 用户确认：目标基因2>": "<TBD, 用户确认：该基因对应要回答的科学问题>"

figure:                                  # 需求18：图表输出规格
  dpi: <TBD, 用户确认，建议默认 300>
  width_in: <TBD, 用户确认>
  height_in: <TBD, 用户确认>
  formats: ["pdf", "tiff"]
  panel_map: "<TBD, 用户确认：figure_id/panel_id 映射方式，可为单独 csv>"
  font_family: "<TBD, 用户确认，如 Helvetica 或 Arial（需求18.5）>"
  base_size: <TBD, 用户确认，如 10>       # 需求18.5 统一基础字号

stats:                                   # 需求23：s10b 样本级统计参数（阶段12）
  min_cells_per_sample: <TBD, 用户确认，设计默认 10>     # 低于此值样本入明细但不入汇总（23.6）
  min_separation_margin: <TBD, 用户确认>                 # 分离余量低于此值记 separation_robust=FALSE（23.8）
  small_sample_design:
    max_samples_per_group: <TBD, 用户确认>               # 小样本设计判定（23.5）
    omit_cell_level_pvalue: true                        # true=不输出细胞级 p 值（23.5）

ambient:                                 # 需求24：环境 RNA 诊断与可选校正（阶段13）
  lineage_markers:                       # 谱系 -> 该谱系本不应表达的基因（24.1）
    # myeloid: ["EPCAM", "KRT8"]
    # epithelial: ["PTPRC", "LYZ"]
  warn_threshold: <TBD, 用户确认，如 0.1>              # 检出比例告警阈值（24.2）
  background_max_detection: <TBD, 用户确认，如 0.05>   # 本底对照群判定：检出低于此值视为不表达（24.3）
  background_exclude_lineages: <TBD, 如 ["epithelial"]>  # 谱系本底口径（24.3/P12-d）：这些谱系之外的细胞合并为
                                                         # lineage_background。auto 口径（nonexpressing_background）
                                                         # 会把环境 RNA 污染重的群排除出本底，本底差值被低估、
                                                         # 目标谱系特异性偏强（偏差有利于预期结论）——论文报告须
                                                         # 以 lineage 口径为主，auto 口径仅作敏感性对照。
  correction:
    enabled: false                        # 默认关闭（24.4）；开启需 R 包 celda(decontX)

diagnostics:                             # 需求25：样本代表性告警（阶段14）
  single_sample_dominance_threshold: <TBD, 用户确认，设计默认 0.70>

module_scores:                           # 需求29：模块特征评分（阶段16）；集合名->基因列表，
  # proinflammatory: ["NOS2", "IL1B", "TNF"]   # 或指向 marker_panels 中一行；评分仅输出连续量
  {}

paths:
  figures_dir: "<TBD, 用户确认，如 {remote_work_dir}/figures>"
  rds_dir: "<TBD, 用户确认，如 {remote_work_dir}/rds>"
  manifest_path: "<TBD, 用户确认，如 {remote_work_dir}/manifest/manifest.json>"
